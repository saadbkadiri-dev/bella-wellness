<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <style>
      .logo-icon { fill: #9B9273; }
      .logo-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; fill: #0D0E0C; letter-spacing: 2.5px; }
      .logo-sub { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 20px; fill: #9B9273; letter-spacing: 2px; }
    </style>
  </defs>
