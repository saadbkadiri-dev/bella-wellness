    <path class="logo-icon" d="M20 40 C 5 35, 0 20, 5 10 C 15 15, 18 28, 20 40 Z" opacity="0.6" />
    <path class="logo-icon" d="M20 40 C 35 35, 40 20, 35 10 C 25 15, 22 28, 20 40 Z" opacity="0.6" />
  </g>
